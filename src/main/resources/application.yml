server:
  port: ${PORT:8080}

spring:
  application:
    name: tickethub-backend

  datasource:
    # Supports Railway native PG* variables, custom DB_* variables, or full SPRING_DATASOURCE_URL
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:${PGHOST:127.0.0.1}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:tickethub_db}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:${PGUSER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:271205}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      # Supports Railway REDIS_URL, native REDIS* variables, REDIS_* variables, or SPRING_DATA_REDIS_*
      url: ${REDIS_URL:${SPRING_DATA_REDIS_URL:}}
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:${REDISHOST:127.0.0.1}}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:${REDISPORT:6379}}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:${REDISPASSWORD:}}}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: tickethub-notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tickethub.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    kafka:
      enabled: false

app:
  jwt:
    # 256-bit base64-encoded secret key
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
